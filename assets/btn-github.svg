<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" role="img" aria-label="Mon profil GitHub, G-R-Alex">
  <title>GitHub · G-R-Alex</title>
  <defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb63d"/><stop offset="1" stop-color="#f0630b"/></linearGradient>
    <clipPath id="b"><polygon points="14,0 260,0 246,52 0,52"/></clipPath>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sh { animation: sh 3.6s ease-in-out infinite; }
      @keyframes sh { 0% { transform: translateX(0); } 55%, 100% { transform: translateX(380px); } }
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <polygon points="14,0 260,0 246,52 0,52" fill="url(#og)"/>
  <g clip-path="url(#b)"><g transform="skewX(-20)"><rect class="sh" x="-120" y="0" width="70" height="52" fill="url(#sh)"/></g></g>
  <text transform="translate(134.0 32) skewX(-14)" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="2" fill="#0a0a0c">GITHUB  ›  G-R-ALEX</text>
</svg>
