<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 20" width="860" height="20" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad1b5" stop-opacity="0"/><stop offset=".5" stop-color="#5ad1b5"/><stop offset="1" stop-color="#5ad1b5" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sweep { animation: sweep 5.5s cubic-bezier(.45,0,.25,1) infinite; }
      @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(860px); } }
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <rect y="9.5" width="860" height="1" fill="#1f2933"/>
  <rect class="sweep" x="0" y="9" width="260" height="2" fill="url(#g)"/>
</svg>
