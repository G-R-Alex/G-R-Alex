<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 52" width="860" height="52" role="img" aria-label="À Propos">
  <title>À Propos</title>
  <defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb63d"/><stop offset="1" stop-color="#f0630b"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bar"><polygon points="228,21 860,21 860,27 222,27"/></clipPath>
    <style>
      .hl { animation: hl 4.8s cubic-bezier(.45,0,.25,1) infinite; }
      @keyframes hl { from { transform: translateX(-160px); } 70%, to { transform: translateX(860px); } }
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <polygon points="16,6 208,6 192,50 0,50" fill="url(#og)"/>
  <text transform="translate(34 35) skewX(-17.6)" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="900" fill="#0a0a0c"
        textLength="152" lengthAdjust="spacing" xml:space="preserve">À PROPOS</text>
  <polygon points="228,21 860,21 860,27 222,27" fill="url(#og)" opacity=".92"/>
  <g clip-path="url(#bar)"><rect class="hl" x="0" y="21" width="160" height="6" fill="url(#hl)"/></g>
  <polygon points="238,33 860,33 860,35 234,35" fill="#2a2e36"/>
