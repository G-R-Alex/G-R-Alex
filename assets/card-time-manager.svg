<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 176" width="420" height="176" role="img" aria-label="Projet Time Manager">
  <title>Time Manager</title>
  <defs><style>
    .edge { animation: edge 7s linear infinite; animation-delay: -4.5s; }
    .live { animation: live 1.8s ease-in-out infinite; }
    @keyframes edge { to { stroke-dashoffset: -1000; } }
    @keyframes live { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style></defs>
  <rect width="420" height="176" rx="14" fill="#0f151c"/>
  <rect class="edge" x="1" y="1" width="418" height="174" rx="13" fill="none" stroke="#5ad1b5" stroke-width="1.6"
        stroke-linecap="round" pathLength="1000" stroke-dasharray="130 870"/>
  <text x="28" y="44" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#e6edf3">Time Manager</text>
  <rect x="298.8" y="22" width="93.2" height="24" rx="12" fill="none" stroke="#2a3541"/>
  <circle cx="313.8" cy="34" r="3" fill="#5ad1b5" class="live"/>
  <text x="353.4" y="38.4" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="1" fill="#8b98a5">EN COURS</text>
  <text x="28" y="82" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8b98a5">Application de gestion du temps :</text>
  <text x="28" y="104" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8b98a5">backend + frontend, projet Epitech.</text>
  <rect x="28" y="128" width="73.2" height="26" rx="13" fill="none" stroke="#2a3541"/><text x="64.6" y="145.2" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5ad1b5">Backend</text><rect x="109.19999999999999" y="128" width="80.8" height="26" rx="13" fill="none" stroke="#2a3541"/><text x="149.6" y="145.2" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5ad1b5">Frontend</text><rect x="198.0" y="128" width="73.2" height="26" rx="13" fill="none" stroke="#2a3541"/><text x="234.6" y="145.2" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#5ad1b5">Epitech</text>
</svg>
