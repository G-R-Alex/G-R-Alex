<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Alex Goncalves Rodrigues, développeur et étudiant en cybersécurité">
  <title>Alex Goncalves Rodrigues</title>
  <defs>
    <style>
    .car   { animation: drive 9.5s cubic-bezier(.32,.12,.38,1) infinite; }
    .cover { animation: drive 9.5s cubic-bezier(.32,.12,.38,1) infinite; }
    .trail { animation: grow  9.5s cubic-bezier(.32,.12,.38,1) infinite; transform-box: fill-box; transform-origin: 0 50%; }
    .fade  { animation: fade  9.5s linear infinite; }
    .spin  { animation: spin .42s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes drive {
      0%   { transform: translateX(-1174px); }
      42.00% { transform: translateX(382px); }
      100% { transform: translateX(382px); }
    }
    @keyframes grow {
      0%   { transform: scaleX(0); }
      42.00% { transform: scaleX(1.32538); }
      100% { transform: scaleX(1.32538); }
    }
    @keyframes fade {
      0%, 72% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d252f"/><stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad1b5" stop-opacity="0"/><stop offset="1" stop-color="#5ad1b5" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0b0f14"/>

  <!-- route -->
  <rect x="0" y="258" width="1200" height="1.2" fill="#232d38"/>
  <rect x="10" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="74" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="138" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="202" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="266" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="330" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="394" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="458" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="522" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="586" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="650" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="714" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="778" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="842" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="906" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="970" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="1034" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="1098" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="1162" y="270" width="26" height="1.2" fill="#1f2933"/>

  <!-- traces de pneus -->
  <g class="fade">
    <rect class="trail" x="-236.6" y="255" width="1174.0" height="6" fill="#5ad1b5" opacity=".55" filter="url(#glow)"/>
    <rect class="trail" x="-236.6" y="256.6" width="1174.0" height="2.2" rx="1" fill="#5ad1b5" opacity=".95"/>
    <rect class="trail" x="-236.6" y="261.2" width="1174.0" height="1.2" rx=".6" fill="#5ad1b5" opacity=".45"/>
  </g>

  <!-- texte (révélé par le passage de la voiture) -->
  <g class="fade">
    <text x="64" y="108" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#e6edf3">Alex Goncalves Rodrigues</text>
    <text x="66" y="150" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b98a5" letter-spacing=".2">Développeur <tspan fill="#5ad1b5">/</tspan> Cybersécurité <tspan fill="#5ad1b5">/</tspan> MSc à Epitech</text>
    <text x="66" y="180" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5b6772">apprendre en testant, cassant, recommençant.</text>
  </g>
  <rect class="cover" x="1134.5" y="52" width="2400" height="146" fill="#0b0f14"/>

  <!-- voiture -->
  <g transform="translate(878 258)">
    <g class="car">
      <g transform="scale(1.35)">
        <!-- traînées de vitesse -->
        <g opacity=".55">
          <rect x="-70" y="-33" width="64" height="1.2" fill="url(#streak)"/>
          <rect x="-48" y="-24" width="42" height="1.2" fill="url(#streak)"/>
          <rect x="-86" y="-16" width="80" height="1.2" fill="url(#streak)"/>
        </g>
        <ellipse cx="98" cy="1.5" rx="96" ry="3.2" fill="#000" opacity=".55"/>
        <!-- carrosserie -->
        <path d="M6,-9 L6,-23 C6,-27 12,-29 24,-30.5 L58,-33 C70,-45 90,-47 108,-45.5 C122,-44 134,-37 150,-33 L180,-28 C187,-26.5 190,-23 190,-18 L190,-9 Z"
              fill="url(#body)" stroke="#5ad1b5" stroke-width="1.3" stroke-linejoin="round"/>
        <!-- vitre -->
        <path d="M64,-34 C74,-43 90,-44.5 106,-43.5 C118,-42.5 130,-37.5 140,-34 Z" fill="#5ad1b5" opacity=".16"/>
        <path d="M100,-43.7 L96,-34" stroke="#5ad1b5" stroke-opacity=".35" stroke-width="1"/>
        <!-- ligne de caractère -->
        <path d="M16,-21.5 C70,-23 130,-22 178,-20.5" stroke="#5ad1b5" stroke-opacity=".5" stroke-width="1" fill="none"/>
        <!-- feux -->
        <rect x="5" y="-24" width="4" height="3.4" rx="1.2" fill="#5ad1b5" class="pulse"/>
        <path d="M183.5,-25.5 L190,-22.5 L190,-20 L181.5,-21.5 Z" fill="#fff" opacity=".92"/>
        <!-- passages de roue -->
        <path d="M27.5,-13 A16.5,16.5 0 0 1 60.5,-13 Z" fill="#0b0f14"/>
        <path d="M133.5,-13 A16.5,16.5 0 0 1 166.5,-13 Z" fill="#0b0f14"/>
        <!-- roues -->
        <g transform="translate(44 -13)">
          <circle r="13" fill="#0b0f14" stroke="#aeb8c2" stroke-width="1.5"/>
          <circle r="8.5" fill="#141b23" stroke="#5ad1b5" stroke-width="1"/>
          <g class="spin">
            <path d="M0,-7.5 L0,7.5 M-7.1,-2.3 L7.1,2.3 M-4.4,6.1 L4.4,-6.1 M-7.1,2.3 L7.1,-2.3 M-4.4,-6.1 L4.4,6.1" stroke="#5ad1b5" stroke-opacity=".75" stroke-width="1"/>
          </g>
          <circle r="2" fill="#5ad1b5"/>
        </g>
        <g transform="translate(150 -13)">
          <circle r="13" fill="#0b0f14" stroke="#aeb8c2" stroke-width="1.5"/>
          <circle r="8.5" fill="#141b23" stroke="#5ad1b5" stroke-width="1"/>
          <g class="spin">
            <path d="M0,-7.5 L0,7.5 M-7.1,-2.3 L7.1,2.3 M-4.4,6.1 L4.4,-6.1 M-7.1,2.3 L7.1,-2.3 M-4.4,-6.1 L4.4,6.1" stroke="#5ad1b5" stroke-opacity=".75" stroke-width="1"/>
          </g>
          <circle r="2" fill="#5ad1b5"/>
        </g>
      </g>
    </g>
  </g>

  <text x="1160" y="46" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5b6772" letter-spacing="1.5">AIX-EN-PROVENCE · FR</text>
  <rect x=".5" y=".5" width="1199" height="299" rx="15.5" fill="none" stroke="#1f2933"/>
</svg>
