<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Alex Goncalves Rodrigues, développeur et étudiant en cybersécurité">
  <title>Alex Goncalves Rodrigues</title>
  <defs>
    <style>
    .car   { animation: drive 9.5s cubic-bezier(.32,.12,.38,1) infinite; }
    .cover { animation: drive 9.5s cubic-bezier(.32,.12,.38,1) infinite; }
    .trail { animation: grow  9.5s cubic-bezier(.32,.12,.38,1) infinite; transform-box: fill-box; transform-origin: 0 50%; }
    .fade  { animation: fade  9.5s linear infinite; }
    .spin  { animation: spin .42s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes drive {
      0%   { transform: translateX(-1175px); }
      42.00% { transform: translateX(401px); }
      100% { transform: translateX(401px); }
    }
    @keyframes grow {
      0%   { transform: scaleX(0); }
      42.00% { transform: scaleX(1.34128); }
      100% { transform: scaleX(1.34128); }
    }
    @keyframes fade {
      0%, 72% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d252f"/><stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad1b5" stop-opacity="0"/><stop offset="1" stop-color="#5ad1b5" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0d1117"/>

  <!-- route -->
  <rect x="0" y="258" width="1200" height="1.2" fill="#232d38"/>
  <rect x="10" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="74" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="138" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="202" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="266" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="330" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="394" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="458" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="522" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="586" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="650" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="714" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="778" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="842" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="906" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="970" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="1034" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="1098" y="270" width="26" height="1.2" fill="#1f2933"/><rect x="1162" y="270" width="26" height="1.2" fill="#1f2933"/>

  <!-- traces de pneus -->
  <g class="fade">
    <rect class="trail" x="-256.2" y="255" width="1175.0" height="6" fill="#5ad1b5" opacity=".55" filter="url(#glow)"/>
    <rect class="trail" x="-256.2" y="256.6" width="1175.0" height="2.2" rx="1" fill="#5ad1b5" opacity=".95"/>
    <rect class="trail" x="-256.2" y="261.2" width="1175.0" height="1.2" rx=".6" fill="#5ad1b5" opacity=".45"/>
  </g>

  <!-- texte (révélé par le passage de la voiture) -->
  <g class="fade">
    <text x="64" y="108" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#e6edf3">Alex Goncalves Rodrigues</text>
    <text x="66" y="150" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b98a5" letter-spacing=".2">Développeur <tspan fill="#5ad1b5">/</tspan> Cybersécurité <tspan fill="#5ad1b5">/</tspan> MSc à Epitech</text>
    <text x="66" y="180" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#5b6772">apprendre en testant, cassant, recommençant.</text>
  </g>
  <rect class="cover" x="1134.6" y="52" width="2400" height="146" fill="#0d1117"/>

  <!-- voiture -->
  <g transform="translate(859 258)">
    <g class="car">
      <g transform="scale(1.3)">
        <!-- traînées de vitesse -->
        <g opacity=".55">
          <rect x="-78" y="-38" width="68" height="1.2" fill="url(#streak)"/>
          <rect x="-52" y="-27" width="42" height="1.2" fill="url(#streak)"/>
          <rect x="-92" y="-17" width="82" height="1.2" fill="url(#streak)"/>
        </g>
        <ellipse cx="108" cy="1.5" rx="108" ry="3.4" fill="#000" opacity=".55"/>

        <!-- aileron arrière : montants puis plan -->
        <path d="M16,-37 L16,-28.5 M31,-37 L31,-29" stroke="#5ad1b5" stroke-opacity=".7" stroke-width="1.6"/>
        <path d="M-4,-49 L44,-48 L40,-36.5 L1,-37.5 Z" fill="url(#body)" stroke="#5ad1b5" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M-2,-45.5 L42,-44.5" stroke="#5ad1b5" stroke-opacity=".45" stroke-width="1"/>

        <!-- carrosserie : nez bas, cabine avancée, capot moteur long -->
        <path d="M8,-9 L5,-21 C5,-25.5 12,-27.5 22,-28.5 L70,-32.5 C84,-34.5 96,-41.5 111,-43.5 C125,-45 137,-44 145,-39.5 L161,-31.5 C173,-28.5 187,-26.5 199,-23.5 C206,-21.5 208,-18.5 207,-14 L206,-9 Z"
              fill="url(#body)" stroke="#5ad1b5" stroke-width="1.3" stroke-linejoin="round"/>
        <!-- vitre -->
        <path d="M115,-42.2 C127,-43.6 137,-43 142,-39.3 L150,-33.2 L112,-33.2 Z" fill="#5ad1b5" opacity=".16"/>
        <path d="M112,-33.2 L152,-33.2" stroke="#5ad1b5" stroke-opacity=".4" stroke-width="1"/>
        <!-- prise d'air latérale et ligne de livrée -->
        <path d="M84,-29.5 L100,-27.5 M84,-25.5 L100,-23.5" stroke="#5ad1b5" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M18,-14.5 C80,-15.5 150,-15 204,-14" stroke="#5ad1b5" stroke-opacity=".55" stroke-width="1.4" fill="none"/>
        <!-- disque de numéro -->
        <circle cx="128" cy="-24.5" r="7" fill="none" stroke="#e6edf3" stroke-opacity=".8" stroke-width="1"/>
        <text x="128" y="-21.4" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" font-weight="700" fill="#e6edf3" fill-opacity=".9">07</text>
        <!-- feux, phare, splitter -->
        <rect x="4" y="-23" width="4" height="3.4" rx="1.2" fill="#5ad1b5" class="pulse"/>
        <path d="M195,-25 L206,-21.5 L206,-19.5 L192,-22.6 Z" fill="#fff" opacity=".92"/>
        <path d="M184,-8.2 L214,-8.2" stroke="#5ad1b5" stroke-width="2" stroke-linecap="round"/>
        <!-- passages de roue -->
        <path d="M28,-14 A18,18 0 0 1 64,-14 Z" fill="#0d1117"/>
        <path d="M134,-14 A18,18 0 0 1 170,-14 Z" fill="#0d1117"/>
        <!-- roues -->
        <g transform="translate(46 -14)">
          <circle r="14" fill="#06090d" stroke="#aeb8c2" stroke-width="1.5"/>
          <circle r="9" fill="#141b23" stroke="#5ad1b5" stroke-width="1"/>
          <g class="spin">
            <path d="M0,-8 L0,8 M-7.6,-2.5 L7.6,2.5 M-4.7,6.5 L4.7,-6.5 M-7.6,2.5 L7.6,-2.5 M-4.7,-6.5 L4.7,6.5" stroke="#5ad1b5" stroke-opacity=".75" stroke-width="1"/>
          </g>
          <circle r="2.2" fill="#5ad1b5"/>
        </g>
        <g transform="translate(152 -14)">
          <circle r="14" fill="#06090d" stroke="#aeb8c2" stroke-width="1.5"/>
          <circle r="9" fill="#141b23" stroke="#5ad1b5" stroke-width="1"/>
          <g class="spin">
            <path d="M0,-8 L0,8 M-7.6,-2.5 L7.6,2.5 M-4.7,6.5 L4.7,-6.5 M-7.6,2.5 L7.6,-2.5 M-4.7,-6.5 L4.7,6.5" stroke="#5ad1b5" stroke-opacity=".75" stroke-width="1"/>
          </g>
          <circle r="2.2" fill="#5ad1b5"/>
        </g>
      </g>
    </g>
  </g>

  <text x="1160" y="46" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#5b6772" letter-spacing="1.5">AIX-EN-PROVENCE · FR</text>
</svg>
