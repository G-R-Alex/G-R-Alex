  <text x="28" y="44" font-family="Inter, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="650" fill="#e6edf3">security-linter</text>
  <rect x="327.6" y="22" width="64.4" height="24" rx="12" fill="none" stroke="#2a3541"/>
  
