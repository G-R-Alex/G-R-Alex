<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 176" width="420" height="176" role="img" aria-label="Projet WikiValorant">
  <title>WikiValorant</title>
  <defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb63d"/><stop offset="1" stop-color="#f0630b"/></linearGradient>
    <clipPath id="c"><polygon points="0,0 396,0 420,24 420,176 24,176 0,152"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .shine { animation: shine 6.5s ease-in-out infinite; animation-delay: -1.6s; }
      .live  { animation: live 1.8s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(0); } 50%, 100% { transform: translateX(660px); } }
      @keyframes live  { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <polygon points="0,0 396,0 420,24 420,176 24,176 0,152" fill="#121419"/>
  <g clip-path="url(#c)">
    <polygon points="26,0 40,0 0,176 -14,176" fill="url(#og)"/>
    <polygon points="46,0 50,0 10,176 6,176" fill="#fff" opacity=".35"/>
    <g transform="skewX(-20)"><rect class="shine" x="-180" y="-10" width="110" height="196" fill="url(#shine)"/></g>
  </g>
  <text x="68" y="44" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="900" font-style="italic" fill="#f4f4f5">WikiValorant</text>
  <polygon points="325.2,22 396.8,22 388.8,46 317.2,46" fill="none" stroke="#ff9b21" stroke-width="1.2"/><text x="357.0" y="38.2" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#ff9b21">PUBLIC</text>
  <text x="64" y="82" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9ba1a9">Wiki non officiel en français : principe du jeu,</text>
  <text x="64" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9ba1a9">rôles des agents, rangs et cartes.</text>
  <polygon points="70.0,128 120.4,128 114.4,154 64.0,154" fill="none" stroke="#383c46" stroke-width="1.1"/><text x="92.2" y="145.2" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff9b21">Wiki</text><polygon points="134.4,128 169.6,128 163.6,154 128.4,154" fill="none" stroke="#383c46" stroke-width="1.1"/><text x="149.0" y="145.2" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#ff9b21">FR</text>
</svg>
